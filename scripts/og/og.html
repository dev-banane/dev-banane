<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=block"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}

			body {
				position: relative;
				font-family: 'Inter', system-ui, sans-serif;
				-webkit-font-smoothing: antialiased;
				background: #0f0f0f;
				color: #e4e4e7;
			}

			.text {
				position: absolute;
				left: 80px;
				top: 50%;
				width: 580px;
				transform: translateY(-50%);
			}

			.id {
				display: flex;
				align-items: center;
				gap: 26px;
			}

			.avatar {
				width: 92px;
				height: 92px;
				border-radius: 50%;
				object-fit: cover;
				flex-shrink: 0;
				border: 1px solid rgba(255, 255, 255, 0.14);
			}

			h1 {
				font-size: 64px;
				font-weight: 650;
				letter-spacing: -0.035em;
				line-height: 1.05;
				color: #fafafa;
			}

			.role {
				margin-top: 30px;
				font-size: 26px;
				color: #a1a1aa;
			}

			.line {
				margin-top: 22px;
				font-size: 22px;
				line-height: 1.55;
				color: #71717a;
			}

			.line b {
				color: #d4d4d8;
				font-weight: 500;
			}

			.grid {
				position: absolute;
				left: 690px;
				top: -150px;
				display: flex;
				gap: 18px;
				transform: rotate(-8deg);
				transform-origin: top left;
			}

			.col {
				display: flex;
				flex-direction: column;
				gap: 18px;
			}

			.col + .col {
				margin-top: 89px;
			}

			.frame {
				width: 256px;
				height: 160px;
				border-radius: 12px;
				overflow: hidden;
				border: 1px solid rgba(255, 255, 255, 0.14);
				background: #18181b;
				box-shadow: 0 24px 48px -18px rgba(0, 0, 0, 0.9);
			}

			.frame img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: top center;
				display: block;
			}

			.fade {
				position: absolute;
				inset: 0 auto 0 620px;
				width: 120px;
				background: linear-gradient(90deg, #0f0f0f, transparent);
			}
		</style>
	</head>
	<body>
		<div class="text">
			<div class="id">
				<img class="avatar" src="../../public/assets/avatar.jpg" alt="" />
				<h1>Jakob Pütz</h1>
			</div>
			<p class="role">Full-stack developer from Aachen, Germany</p>
			<p class="line">
				Creator of <b>PFControl</b>, 12,000+ users.<br />Building <b>Weavay</b> and
				<b>Petal</b>.
			</p>
		</div>

		<div class="grid">
			<div class="col">
				<div class="frame"><img src="../../public/assets/work/acserver.webp" alt="" /></div>
				<div class="frame"><img src="../../public/assets/work/toonscope.webp" alt="" /></div>
				<div class="frame"><img src="../../public/assets/work/pfcontrol.webp" alt="" /></div>
				<div class="frame"><img src="../../public/assets/work/weavay.webp" alt="" /></div>
				<div class="frame"><img src="../../public/assets/work/userscriptsplus.webp" alt="" /></div>
			</div>
			<div class="col">
				<div class="frame"><img src="../../public/assets/work/tools.webp" alt="" /></div>
				<div class="frame"><img src="../../public/assets/work/cephie.webp" alt="" /></div>
				<div class="frame"><img src="../../public/assets/work/fsd.webp" alt="" /></div>
				<div class="frame"><img src="../../public/assets/work/petal.webp" alt="" /></div>
				<div class="frame"><img src="../../public/assets/work/devjakob.webp" alt="" /></div>
			</div>
		</div>
		<div class="fade"></div>
	</body>
</html>
